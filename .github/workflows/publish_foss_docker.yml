# ===============================================================
# Chatwoot Nestor - Build e Publicação no GHCR (GitHub Container Registry)
# Adaptado por Gerllanio - GTI Tecnologia da Informação
# ===============================================================

name: Publish Chatwoot Nestor Docker image to GHCR

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chatwoot-nestor
      GIT_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      # 📦 Checkout do código-fonte
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 Ajuste de build (mantido do original)
      - name: Make custom changes
        run: |
          sed -i 's/"name": "Teste"/"name": "Chatwoot Nestor"/g' public/manifest.json
          sed -i 's/"short_name": "Teste"/"short_name": "CWN"/g' public/manifest.json

      # 🧰 Configura QEMU (para build multi-plataforma)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 🧱 Configura Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🏷️ Gera tags automáticas (para develop, master e versões)
      - name: Set up Docker tags
        id: docker_tag
        run: |
          echo "TAGS=${IMAGE_NAME}:${GIT_REF}" >> $GITHUB_ENV
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "LATEST_TAG=${IMAGE_NAME}:latest" >> $GITHUB_ENV
          fi

      # 🔐 Login no GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🏗️ Build e Push da imagem (amd64)
      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TAGS }}
            ${{ env.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ✅ Log de conclusão
      - name: Done
        run: echo "✅ Imagem publicada com sucesso em ${{ env.IMAGE_NAME }}"
